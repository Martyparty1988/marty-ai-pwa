<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PWA pro správu rezervací vil a souvisejících úkolů">
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <title>Marty AI - Správa rezervací vil</title>
  <script>
    // Check if app is installed or in standalone mode
    if (window.matchMedia('(display-mode: standalone)').matches) {
      document.documentElement.classList.add('standalone');
    }
  </script>
  <style>
    /* Splash screen styles */
    .splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #4f46e5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      color: white;
      transition: opacity 0.3s ease-out;
    }
    
    .splash-logo {
      width: 120px;
      height: 120px;
      margin-bottom: 1rem;
      animation: pulse 2s infinite;
    }
    
    .splash-title {
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 1rem;
    }
    
    .splash-subtitle {
      font-size: 1rem;
      opacity: 0.9;
    }
    
    .splash-spinner {
      margin-top: 2rem;
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s linear infinite;
    }
    
    @keyframes pulse {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
      100% {
        transform: scale(1);
      }
    }
    
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    
    .hide-splash {
      opacity: 0;
      pointer-events: none;
    }
    
    /* App installation banner */
    .install-banner {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1rem;
      background-color: white;
      box-shadow: 0 -4px 6px -1px rgba(0, 0, 0, 0.1);
      z-index: 50;
      align-items: center;
      justify-content: space-between;
    }
    
    .install-banner p {
      margin: 0;
      font-size: 0.9rem;
    }
    
    .install-banner button {
      background-color: #4f46e5;
      color: white;
      border: none;
      border-radius: 0.375rem;
      padding: 0.5rem 1rem;
      font-weight: 500;
      cursor: pointer;
    }
    
    .install-banner.show {
      display: flex;
    }
    
    .standalone .install-banner {
      display: none !important;
    }
  </style>
</head>
<body>
  <!-- Splash screen -->
  <div id="splash-screen" class="splash-screen">
    <div class="splash-logo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M2 17L12 22L22 17" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M2 12L12 17L22 12" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1 class="splash-title">Marty AI</h1>
    <p class="splash-subtitle">Správa rezervací vil</p>
    <div class="splash-spinner"></div>
  </div>
  
  <!-- Install banner -->
  <div id="install-banner" class="install-banner">
    <p>Nainstalujte si Marty AI na vaše zařízení pro lepší zážitek</p>
    <button id="install-button">Instalovat</button>
  </div>
  
  <!-- React root -->
  <div id="root"></div>
  
  <script>
    // Hide splash screen after app loads
    window.addEventListener('load', function() {
      setTimeout(function() {
        document.getElementById('splash-screen').classList.add('hide-splash');
      }, 1500);
    });
    
    // PWA installation
    let deferredPrompt;
    
    window.addEventListener('beforeinstallprompt', (e) => {
      // Prevent Chrome 67+ from automatically showing the prompt
      e.preventDefault();
      // Stash the event so it can be triggered later
      deferredPrompt = e;
      // Show the install banner
      document.getElementById('install-banner').classList.add('show');
    });
    
    document.getElementById('install-button').addEventListener('click', (e) => {
      // Hide the app provided install banner
      document.getElementById('install-banner').classList.remove('show');
      // Show the install prompt
      deferredPrompt.prompt();
      // Wait for the user to respond to the prompt
      deferredPrompt.userChoice.then((choiceResult) => {
        if (choiceResult.outcome === 'accepted') {
          console.log('User accepted the install prompt');
        } else {
          console.log('User dismissed the install prompt');
        }
        deferredPrompt = null;
      });
    });
    
    // Hide the banner when the app is installed
    window.addEventListener('appinstalled', (evt) => {
      document.getElementById('install-banner').classList.remove('show');
      console.log('App was installed');
    });
  </script>
</body>
</html>
